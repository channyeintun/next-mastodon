name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Get Bun cache directory
        id: bun-cache
        run: echo "dir=~/.bun/install/cache" >> $GITHUB_OUTPUT

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        # Explicit so CI can never resolve versions that differ from bun.lock,
        # regardless of the default for the environment.
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Check locale synchronization
        run: bun run lint:locales

      - name: Build project (PR validation)
        if: github.event_name == 'pull_request'
        run: bun run build

      - name: Build for Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
